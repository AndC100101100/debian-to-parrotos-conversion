---
- name: Convert Debian VMs to Parrot OS Headless
  hosts: parrot_vms
  become: true
  vars:
    parrot_keyring_url: "https://deb.parrot.sh/parrot/pool/main/p/parrot-archive-keyring/parrot-archive-keyring_2024.12_all.deb"
    parrot_keyring_deb: "/tmp/parrot-archive-keyring_2024.12_all.deb"
    parrot_repo_file: "/etc/apt/sources.list"
    parrot_list_file: "/etc/apt/sources.list.d/parrot.list"
    listchanges_conf_file: "/etc/apt/listchanges.conf"
    os_release_file: "/etc/os-release"
    core_packages:
      - bash
      - wget
      - gnupg
    # TODO: parrot-core-lite and parrot-apps-basics were part of the headless
    # edition that was removed from the upstream bash script. Their availability
    # in the 'echo' repo should be verified before running this playbook.
    # If they are no longer maintained, replace parrot-core-lite with parrot-core
    # and remove parrot-apps-basics (or find a suitable replacement).
    headless_packages:
      - parrot-core-lite
      - base-files
      - parrot-apps-basics
      - parrot-drivers
    pentesting_tools: "parrot-tools-full"

  tasks:
    - name: Gather System Architecture
      command: uname -m
      register: system_arch
      changed_when: false

    - name: Blacklist broadcom-sta-dkms for ARM64 Architecture
      command: apt-mark hold broadcom-sta-dkms
      when: system_arch.stdout == "aarch64"

    - name: Install Core Dependencies
      apt:
        name: "{{ core_packages }}"
        state: present
        update_cache: yes

    - name: Download Parrot OS Archive Keyring Package
      get_url:
        url: "{{ parrot_keyring_url }}"
        dest: "{{ parrot_keyring_deb }}"

    - name: Install Parrot OS Archive Keyring
      apt:
        deb: "{{ parrot_keyring_deb }}"
        state: present

    - name: Copy Parrot OS sources.list
      copy:
        src: files/sources.list
        dest: "{{ parrot_repo_file }}"
        mode: '0644'

    - name: Copy Parrot OS parrot.list to sources.list.d
      copy:
        src: files/parrot.list
        dest: "{{ parrot_list_file }}"
        mode: '0644'

    - name: Copy APT listchanges.conf
      copy:
        src: files/listchanges.conf
        dest: "{{ listchanges_conf_file }}"
        mode: '0644'

    - name: Update APT Cache
      apt:
        update_cache: yes

    - name: Copy OS Release Configuration
      copy:
        src: files/os-release
        dest: "{{ os_release_file }}"
        mode: '0644'

    - name: Update APT Cache
      apt:
        update_cache: yes

    - name: Upgrade System Packages
      apt:
        upgrade: dist

    - name: Install Parrot Core Package
      apt:
        name: parrot-core
        state: present

    - name: Install Headless Edition Packages
      apt:
        name: "{{ headless_packages }}"
        state: present

    - name: Install Parrot Tools Full Suite
      apt:
        name: "{{ pentesting_tools }}"
        state: present

    - name: Enable SSH Service for Remote Access
      service:
        name: ssh
        state: started
        enabled: true

    - name: Reboot the VM to Finalize Installation
      reboot:
        msg: "Rebooting to finalize Parrot OS installation."
        pre_reboot_delay: 5
        post_reboot_delay: 10
